
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notre album souvenir</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #d4ccc2;
  color: #403a35;
  font-family: Georgia, serif;
  text-align: center;
  position: relative;
  isolation: isolate;
}

body::before {
  content: "";
  position: fixed;
  inset: -20px;
  z-index: -1;

  background:
    linear-gradient(
      rgba(35, 30, 27, 0.55),
      rgba(35, 30, 27, 0.55)
    ),
    url("fond.jpg") center / cover no-repeat;

  filter: blur(7px);
}

header { padding: 24px 12px 10px; }

h1 {
  font-size: 25px;
  font-weight: normal;
  margin: 0 0 8px;
}

.subtitle {
  color: #766d65;
  font-size: 14px;
}

#status {
  margin: 15px;
  font-family: Arial, sans-serif;
  font-size: 14px;
}

#book-area {
  width: 100%;
  display: flex;
  justify-content: center;
  padding: 10px;
}

#book {
  margin: auto;
}

.page {
  background: white;
  overflow: hidden;
}

.page canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 15px;
  padding: 15px;
  font-family: Arial, sans-serif;
}

button {
  background: #62584f;
  color: white;
  border: none;
  border-radius: 25px;
  padding: 12px 20px;
  font-size: 14px;
}

button:disabled { opacity: .4; }

.download {
  display: inline-block;
  margin: 10px auto 25px;
  padding: 13px 22px;
  border: 1px solid #c9bfb4;
  border-radius: 25px;
  background: white;
  color: #51473e;
  text-decoration: none;
  font-family: Arial, sans-serif;
}

footer {
  padding: 10px;
  color: #8a8179;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <h1>Un album de souvenirs</h1>
  <div class="subtitle">Des moments précieux à garder</div>
</header>

<div id="status">Préparation de votre album...</div>

<div id="book-area">
  <div id="book"></div>
</div>

<div class="controls">
  <button id="previous" disabled>Précédent</button>
  <span id="counter">Page 1</span>
  <button id="next" disabled>Suivant</button>
</div>

<a class="download" href="./album.pdf" download="album-souvenir.pdf">
  Télécharger l'album en PDF
</a>

<footer>Créé avec affection</footer>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const status = document.getElementById("status");
const bookElement = document.getElementById("book");
const previousButton = document.getElementById("previous");
const nextButton = document.getElementById("next");
const counter = document.getElementById("counter");

let pageFlip;

async function createAlbum() {
  try {
    const pdf = await pdfjsLib.getDocument("./album.pdf").promise;

    status.textContent = "Chargement des " + pdf.numPages + " pages...";

    const fragment = document.createDocumentFragment();

    for (let i = 1; i <= pdf.numPages; i++) {
      const pdfPage = await pdf.getPage(i);

      const viewport = pdfPage.getViewport({ scale: 1.5 });

      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d");

      canvas.width = viewport.width;
      canvas.height = viewport.height;

      await pdfPage.render({
        canvasContext: context,
        viewport: viewport
      }).promise;

      const page = document.createElement("div");
      page.className = "page";
      page.appendChild(canvas);

      fragment.appendChild(page);
    }

    bookElement.appendChild(fragment);

    const firstPage = await pdf.getPage(1);
    const originalViewport = firstPage.getViewport({ scale: 1 });

    const pageWidth = Math.round(originalViewport.width);
    const pageHeight = Math.round(originalViewport.height);

    pageFlip = new St.PageFlip(bookElement, {
      width: pageWidth,
      height: pageHeight,
      size: "stretch",
      minWidth: 280,
      maxWidth: 1000,
      minHeight: 350,
      maxHeight: 1400,
      showCover: true,
      usePortrait: true,
      autoSize: true,
      maxShadowOpacity: 0.3,
      mobileScrollSupport: false
    });

    pageFlip.loadFromHTML(
      bookElement.querySelectorAll(".page")
    );

    function updateCounter() {
      const current = pageFlip.getCurrentPageIndex() + 1;

      counter.textContent =
        "Page " + current + " / " + pdf.numPages;

      previousButton.disabled = current === 1;
      nextButton.disabled = current === pdf.numPages;
    }

    previousButton.addEventListener("click", () => {
      pageFlip.flipPrev();
    });

    nextButton.addEventListener("click", () => {
      pageFlip.flipNext();
    });

    pageFlip.on("flip", updateCounter);

    updateCounter();

    status.textContent = "";

  } catch (error) {
    console.error(error);
    status.textContent =
      "Impossible de charger l'album. Vérifiez le fichier album.pdf et réessayez.";
  }
}

createAlbum();
</script>

</body>
</html>
