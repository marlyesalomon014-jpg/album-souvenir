
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notre album souvenir</title>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #eeeae5;
  font-family: Georgia, serif;
  color: #403a35;
  display: flex;
  flex-direction: column;
  align-items: center;
}

header {
  text-align: center;
  padding: 25px 15px 12px;
}

h1 {
  font-weight: normal;
  font-size: 25px;
  margin: 0 0 8px;
}

.subtitle {
  font-size: 14px;
  color: #766d65;
}

#book-area {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 15px;
}

#book {
  margin: auto;
}

.page {
  background: white;
  overflow: hidden;
}

.page img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: white;
}

.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 12px;
}

button {
  border: none;
  background: #62584f;
  color: white;
  border-radius: 25px;
  padding: 12px 22px;
  font-size: 14px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.4;
}

#counter {
  font-size: 14px;
  min-width: 75px;
  text-align: center;
}

.download {
  margin: 12px 0 30px;
  text-decoration: none;
  background: #fff;
  color: #51473e;
  border: 1px solid #c9bfb4;
  border-radius: 25px;
  padding: 13px 22px;
  font-family: Arial, sans-serif;
  font-size: 14px;
}

footer {
  font-size: 12px;
  color: #8a8179;
  padding: 10px;
  text-align: center;
}
</style>
</head>

<body>

<header>
  <h1>Un album de souvenirs</h1>
  <div class="subtitle">Des moments précieux à garder</div>
</header>

<div id="book-area">
  <div id="book"></div>
</div>

<div class="controls">
  <button id="previous">Précédent</button>
  <span id="counter">Page 1</span>
  <button id="next">Suivant</button>
</div>

<a class="download" href="album.pdf" download>
  Télécharger l'album en PDF
</a>

<footer>
  Créé avec affection
</footer>

<script>
const pages = [
  "page-1.jpg",
  "page-2.jpg",
  "page-3.jpg",
  "page-4.jpg"
  // Ajoute ici les autres pages dans l'ordre.
];

const bookElement = document.getElementById("book");

pages.forEach((filename) => {
  const page = document.createElement("div");
  page.className = "page";

  const img = document.createElement("img");
  img.src = filename;
  img.alt = "Page de l'album";
  img.draggable = false;

  page.appendChild(img);
  bookElement.appendChild(page);
});

const pageFlip = new St.PageFlip(bookElement, {
  width: 420,
  height: 560,
  size: "stretch",
  minWidth: 280,
  maxWidth: 900,
  minHeight: 373,
  maxHeight: 1200,
  showCover: false,
  mobileScrollSupport: false,
  maxShadowOpacity: 0.35,
  usePortrait: true,
  autoSize: true
});

pageFlip.loadFromHTML(
  document.querySelectorAll(".page")
);

function updateCounter() {
  const current = pageFlip.getCurrentPageIndex() + 1;
  document.getElementById("counter").textContent =
    "Page " + current + " / " + pages.length;

  document.getElementById("previous").disabled =
    current === 1;

  document.getElementById("next").disabled =
    current === pages.length;
}

document.getElementById("previous").addEventListener(
  "click",
  () => pageFlip.flipPrev()
);

document.getElementById("next").addEventListener(
  "click",
  () => pageFlip.flipNext()
);

pageFlip.on("flip", updateCounter);

updateCounter();
</script>

</body>
</html>
